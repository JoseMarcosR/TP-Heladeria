server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heladeria}
    username: ${DB_USER:heladeria}
    password: ${DB_PASSWORD:heladeria}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: pedidos
      jakarta:
        persistence:
          create-database-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri solo valida el claim "iss"; las claves se leen de jwk-set-uri
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/heladeria}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/heladeria/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    persist-authorization: true

# Endpoint POST /v1/.../admin/reset (soporte a pruebas de la colección Postman). Poner en false para deshabilitarlo.
app:
  datos-prueba:
    reset-habilitado: ${DATOS_PRUEBA_RESET_HABILITADO:true}
