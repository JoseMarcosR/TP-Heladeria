<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 305.866 547.5999999999999" width="305.866" height="547.5999999999999" style="--bg:#18181B;--fg:#F4F4F5;--line:#71717A;--muted:#A1A1AA;--surface:#27272A;--border:#3F3F46;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="_start" data-to="PLANIFICADO" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="POST /v1/viajes/planificar/regiones/{idRegion}
Cumple piso &gt;= 280 tachos, RN-02 (capacidad)
y RN-03 (&lt;= 10 h con OSRM)" points="153,68 153,212.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="PLANIFICADO" data-to="FINALIZADO" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="PUT /v1/viajes/{id}/cierre
Actualiza paradas (entregadoConfirmado),
registra fechaCierre y libera al camionero" points="153,249.8 153,394.7" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="FINALIZADO" data-to="_end" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="153,431.59999999999997 153,479.59999999999997" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="_start" data-to="PLANIFICADO" data-label="POST /v1/viajes/planificar/regiones/{idRegion}
Cumple piso &gt;= 280 tachos, RN-02 (capacidad)
y RN-03 (&lt;= 10 h con OSRM)">
  <rect x="35.999999999999986" y="110.99999999999999" width="233.866" height="58.900000000000006" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="152.933" y="140.45" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="152.933" dy="-10.450000000000001">POST /v1/viajes/planificar/regiones/{idRegion}</tspan><tspan x="152.933" dy="14.3">Cumple piso &gt;= 280 tachos, RN-02 (capacidad)</tspan><tspan x="152.933" dy="14.3">y RN-03 (&lt;= 10 h con OSRM)</tspan></text>
</g>
<g class="edge-label" data-from="PLANIFICADO" data-to="FINALIZADO" data-label="PUT /v1/viajes/{id}/cierre
Actualiza paradas (entregadoConfirmado),
registra fechaCierre y libera al camionero">
  <rect x="44.5" y="292.8" width="216.046" height="58.900000000000006" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="152.523" y="322.25" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="152.523" dy="-10.450000000000001">PUT /v1/viajes/{id}/cierre</tspan><tspan x="152.523" dy="14.3">Actualiza paradas (entregadoConfirmado),</tspan><tspan x="152.523" dy="14.3">registra fechaCierre y libera al camionero</tspan></text>
</g>
<g class="node" data-id="_start" data-label="" data-shape="state-start">
  <circle cx="153" cy="54" r="12" fill="var(--_text)" stroke="none" />
</g>
<g class="node" data-id="PLANIFICADO" data-label="PLANIFICADO" data-shape="rounded">
  <rect x="89.047" y="212.9" width="127.90599999999999" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="153" y="231.35000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">PLANIFICADO</text>
</g>
<g class="node" data-id="FINALIZADO" data-label="FINALIZADO" data-shape="rounded">
  <rect x="93.493" y="394.7" width="119.014" height="36.900000000000006" rx="6" ry="6" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="153" y="413.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">FINALIZADO</text>
</g>
<g class="node" data-id="_end" data-label="" data-shape="state-end">
  <circle cx="153" cy="493.59999999999997" r="12" fill="none" stroke="var(--_text)" stroke-width="1.5" />
  <circle cx="153" cy="493.59999999999997" r="8" fill="var(--_text)" stroke="none" />
</g>
</svg>